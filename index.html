<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
      font-family: "Pretendard", sans-serif;
      overflow: hidden;
    }
    .phone {
      overflow: hidden;
      position: relative;
      width: 280px;
      height: 600px;
      background-image: url(https://cdn.discordapp.com/attachments/1161239105489866772/1561390092575318138/IMG_4169.png?ex=6ad62d57&is=6ad4dbd7&hm=c14f8811235b73568cf82a8f621ed3232447c9ea80b1833e17036920f8efbd96&);
      background-size: cover;
      background-repeat: no-repeat;
      border-radius: 40px;
      box-shadow: 0 10px 20px rgba(255,255,255,0.2);
    }
    .lock {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      background-image: url(https://cdn.discordapp.com/attachments/1161239105489866772/1561390092575318138/IMG_4169.png?ex=6ad62d57&is=6ad4dbd7&hm=c14f8811235b73568cf82a8f621ed3232447c9ea80b1833e17036920f8efbd96&);
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
      user-select: none;
      transition: transform 0.5s;
      touch-action: none;
    }
    .lock.up {
      transform: translateY(-100%);
    }
    .lock-date {
      margin-top: 50px;
      font-size: 18px;
      font-weight: 600;
      opacity: 0.8;
    }
    .lock-time {
      font-size: 95px;
      font-weight: 600;
      opacity: 0.8;
      line-height: 1;
      margin-top: -6px;
      letter-spacing: -5px;
    }
    .lock-btn {
      position: absolute;
      bottom: 40px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s;
    }
    .lock-btn.left {
      left: 30px;
    }
    .lock-btn.right {
      right: 30px;
    }
    .lock-btn:active {
      transform: scale(1.2);
    }
    .island {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 23px;
      background: black;
      border-radius: 20px;
    }
    .bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 5px;
      background: white;
      opacity: 0.5;
      border-radius: 3px;
      transition: width 0.2s;
    }
    .bar:active {
      width: 125px;
    }
    .status {
      position: absolute;
      top: 13px;
      left: 0;
      right: 0;
      height: 26px;
      padding-left: 42px;
      padding-right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      font-size: 15px;
      font-weight: 600;
    }
    .icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dock {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 249px;
      height: 70px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      justify-content: center;
      gap: 10px;
      align-items: center;
    }
    .app {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      overflow: hidden;
    }
    .calendar {
      container-type: size;
      background: linear-gradient(#ffffff, #f0f0f0);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1px;
      cursor: pointer;
      box-sizing: border-box;
      padding-top: 6px;
    }
    .calendar .day {
      font-size: 19cqw;
      font-weight: 700;
      color: #1c1c1e;
      line-height: 1;
    }
    .calendar .num {
      font-size: 58cqw;
      font-weight: 300;
      color: #333;
      line-height: 1;
    }
    .app img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .messages {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      background: white;
      color: black;
      user-select: none;
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      touch-action: none;
    }
    .messages.open {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .msg-title {
      margin: 62px 16px 8px;
      font-size: 30px;
      font-weight: 700;
    }
    .msg-search {
      margin: 0 16px 8px;
      height: 32px;
      border-radius: 10px;
      background: #eeeef0;
      color: #8e8e93;
      font-size: 14px;
      display: flex;
      align-items: center;
      padding-left: 12px;
      box-sizing: border-box;
    }
    .msg-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      cursor: pointer;
      position: relative;
    }
    .msg-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(#a5aab5, #858a95);
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 18px;
      font-weight: 600;
    }
    .msg-text {
      flex: 1;
      min-width: 0;
    }
    .msg-name {
      font-size: 14px;
      font-weight: 600;
    }
    .msg-preview {
      font-size: 13px;
      line-height: 1.3;
      color: #8e8e93;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .msg-time {
      align-self: flex-start;
      padding-top: 1px;
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      color: #8e8e93;
      white-space: nowrap;
    }
    .msg-chev { font-size: 16px; color: #c7c7cc; line-height: 1; }
    .msg-dot {
      position: absolute;
      left: 4px;
      top: 50%;
      width: 8px;
      height: 8px;
      margin-top: -4px;
      border-radius: 50%;
      background: #3b86f7;
    }
    .phone.in-msg .status { color: black; }
    .phone.in-msg .bar { background: black; }

    .chat {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      background: white;
      color: black;
      user-select: none;
      transform: translateX(100%);
      pointer-events: none;
      transition: transform 0.3s;
      display: flex;
      flex-direction: column;
    }
    .chat.open {
      transform: translateX(0);
      pointer-events: auto;
    }
    .chat-head {
      position: relative;
      height: 96px;
      box-sizing: border-box;
      padding-top: 42px;
      text-align: center;
      background: #f9f9f9;
      border-bottom: 1px solid #e5e5ea;
      border-radius: 40px 40px 0 0;
      flex-shrink: 0;
    }
    .chat-head .msg-avatar {
      width: 32px;
      height: 32px;
      font-size: 14px;
      margin: 0 auto 2px;
    }
    .chat-name {
      font-size: 11px;
    }
    .chat-back {
      position: absolute;
      left: 14px;
      top: 52px;
      color: #007aff;
      font-size: 15px;
      cursor: pointer;
    }
    .chat-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      touch-action: pan-y;
      padding: 12px 12px 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scrollbar-width: none;
    }
    .row {
      position: relative;
      display: flex;
      width: 100%;
      flex-shrink: 0;
      transform: translateX(calc(var(--dx, 0) * -1px));
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .row.in  { justify-content: flex-start; }
    .row.out { justify-content: flex-end; }
    .chat-body.dragging .row { transition: none; }

    .bubble {
      max-width: 75%;
      padding: 7px 12px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.3;
      white-space: pre-wrap;
    }
    .row.in .bubble  { background: #e9e9eb; }
    .row.out .bubble { background: #007aff; color: white; }

    .time {
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      padding-left: 8px;
      box-sizing: border-box;
      font-size: 11px;
      color: #8e8e93;
      white-space: nowrap;
      pointer-events: none;
      opacity: calc(var(--dx, 0) / 52);
      transition: opacity 0.3s;
    }
    .chat-body.dragging .time { transition: none; }

    /* ===== 채팅 입력창 ===== */
    .chat-input {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 26px;
      background: white;
      flex-shrink: 0;
    }
    .plus-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 1px 6px rgba(0,0,0,0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      cursor: pointer;
    }
    .input-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 32px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 1px 6px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
    }
    .input-wrap input {
      flex: 1;
      width: 100%;
      min-width: 0;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      padding: 0 38px 0 12px;
      user-select: text;
      caret-color: #3b86f7;
    }
    .input-wrap input::placeholder {
      color: #c0c0c5;
    }
    .mic {
      position: absolute;
      right: 10px;
      display: flex;
    }
    .send {
      position: absolute;
      right: 3px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #3b86f7;
      display: none;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .input-wrap.typing .mic { display: none; }
    .input-wrap.typing .send { display: flex; }

    /* ===== 캘린더 ===== */
    .cal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      background: white;
      color: black;
      user-select: none;
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .cal.open {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .cal-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      overscroll-behavior: contain;
    }
    .cal-scroll::-webkit-scrollbar { display: none; }
    .cal-month {
      height: 100%;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      padding-bottom: 22px;
      box-sizing: border-box;
    }
    .cal-title {
      margin: 58px 16px 6px;
      font-size: 30px;
      font-weight: 800;
    }
    .cal-week {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      padding-bottom: 4px;
    }
    .cal-week span:first-child,
    .cal-week span:last-child { color: #8e8e93; }
    .cal-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .cal-cell {
      border-top: 1px solid #e5e5ea;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 3px;
      min-width: 0;
    }
    .cal-cell.off { color: #8e8e93; }
    .cal-num {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 17px;
      font-weight: 600;
    }
    .cal-cell.today .cal-num {
      background: #ff3b30;
      color: white;
    }
    .cal-ev {
      flex-shrink: 0;
      margin-top: 3px;
      width: calc(100% - 2px);
      height: 14px;
      border-radius: 7px;
      background: #c9e6d6;
      color: #2d5a3f;
      font-size: 8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 3px;
      box-sizing: border-box;
      white-space: nowrap;
      overflow: hidden;
    }
    .cal-ev i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3f9a63;
      flex-shrink: 0;
    }
    .home-zone {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 36px;
      touch-action: none;
      z-index: 5;
    }

    /* ===== 날짜 눌렀을 때 아래에 뜨는 일정창 ===== */
    .cal-cell { cursor: pointer; overflow: hidden; position: relative; }
    .cal-cell.selected .cal-num { background: #1c1c1e; color: white; }
    .cal-cell.today .cal-num { background: #ff3b30; color: white; }
    .cal-more {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 1px;
      text-align: center;
      font-size: 7px;
      color: #8e8e93;
      line-height: 1;
    }
    .cal.sheet-open .cal-title { margin-top: 48px; font-size: 24px; }
    .cal.sheet-open .cal-month { padding-bottom: 4px; }
    .cal-sheet {
      transition: transform 0.2s;
      display: none;
      height: 220px;
      flex-shrink: 0;
      background: white;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
      padding: 0 16px 34px;
      box-sizing: border-box;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .cal.sheet-open .cal-sheet { display: block; }
    .sheet-grab { padding: 14px 0 12px; cursor: pointer; touch-action: none; }
    .sheet-bar {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: #d1d1d6;
      margin: 0 auto;
    }
    .sheet-title {
      touch-action: none;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .ev-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      align-items: stretch;
    }
    .ev-time {
      width: 34px;
      flex-shrink: 0;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .ev-time b { font-weight: 600; color: #1c1c1e; }
    .ev-time span { color: #8e8e93; }
    .ev-bar {
      width: 3px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .ev-title { font-size: 14px; font-weight: 600; }
    .ev-memo { font-size: 11px; color: #8e8e93; margin-top: 2px; }
    .ev-empty { font-size: 13px; color: #8e8e93; }

    /* ===== 앱 아이콘 빨간 배지 ===== */
    .app-wrap { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
    .app-wrap .app { display: block; }
    .badge {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      box-sizing: border-box;
      border-radius: 9px;
      background: #ff3b30;
      color: white;
      font-size: 11px;
      font-weight: 600;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    /* ===== 위에서 내려오는 알림 ===== */
    .banner {
      position: absolute;
      top: 44px;
      left: 8px;
      right: 8px;
      z-index: 30;
      box-sizing: border-box;
      padding: 8px 12px 10px;
      border-radius: 22px;
      background: rgba(250, 250, 250, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      color: #1c1c1e;
      user-select: none;
      cursor: pointer;
      transform: translateY(-160%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.1), opacity 0.3s;
    }
    .banner.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .banner-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
      font-size: 10px;
      color: #6e6e73;
    }
    .banner-top img { width: 16px; height: 16px; border-radius: 4px; object-fit: cover; }
    .banner-top .grow { flex: 1; }
    .banner-name { font-size: 13px; font-weight: 700; }
    .banner-text {
      font-size: 12px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="phone">

    <div class="dock">
      <a class="app">
        <img src="https://cdn.discordapp.com/attachments/1161239105489866772/1561423134018769089/BqZSmq8DEIVmrsrM2ZjJFk4Ly7VN2w9eDFvVYWUkt2hI_bMNRo2Fvymz_lDWJ6BUwEQeLXW9T5jxN3hOb_qeN6o6Bm_-VuBr_uryFg5DKs6oVzamsOoqI7iImzoaxB5Z7iza1bHVkSWmcCViFSDmRg.webp?ex=6ad64c1c&is=6ad4fa9c&hm=60abe7b69df9cca358ea2696c94408be7e93f034af8d37033aec92c50144f3e2&">
      </a>
      <div class="app calendar" id="calApp">
        <div class="day">월요일</div>
        <div class="num">7</div>
      </div>
      <div class="app-wrap">
        <a class="app" id="msgApp">
        <img src="https://cdn.discordapp.com/attachments/1161239105489866772/1561414546885836890/png-clipart-computer-icons-imessage-imessage-leaf-logo-thumbnail.png?ex=6ad6441d&is=6ad4f29d&hm=e07576a2f1593937e0522d02fe4365644e81e1beaa08f417ac172d2cf0ac4670&">
      </a>
        <div class="badge" id="msgBadge"></div>
      </div>
      <a class="app" href="https://www.daydreamcorp.space/ko" target="_blank">
        <img src="https://cdn.discordapp.com/attachments/1161239105489866772/1561413157400879317/safari_ios_browser_logo_icon_152966.png?ex=6ad642d2&is=6ad4f152&hm=a6238df4726db263a304a32f29ab37ab867813a19ebcf1e95ec0b652ec57dc43&">
      </a>
    </div>

    <div class="lock">
      <div class="lock-date">9월 7일 (월)</div>
      <div class="lock-time">21:17</div>
      <div class="lock-btn left">
        <svg width="20" height="24" viewBox="0 0 20 24" fill="white">
          <rect x="3" y="0" width="14" height="5" rx="1.5"/>
          <path d="M5 7h10v13a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/>
          <rect x="8.5" y="11" width="3" height="6" rx="1.5" fill="rgba(0,0,0,0.35)"/>
        </svg>
      </div>
      <div class="lock-btn right">
        <svg width="24" height="20" viewBox="0 0 24 20" fill="white">
          <path d="M8 2l1.5-2h5L16 2h4a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3z"/>
          <circle cx="12" cy="10.5" r="4.5" fill="rgba(0,0,0,0.35)"/>
        </svg>
      </div>
    </div>

    <div class="messages">
      <div class="msg-title">메시지</div>
      <div class="msg-search">검색</div>

      <div id="msgList"></div>
    </div>

    <div class="chat">
      <div class="chat-head">
        <div class="chat-back">‹ 메시지</div>
        <div class="msg-avatar" id="chatAvatar">백</div>
        <div class="chat-name" id="chatName">백일몽 주식회사</div>
      </div>
      <div class="chat-body" id="chatBody"></div>

    phone.onpointerup = function (e) {
      if (startInChat) return;
      if (startY - e.clientY > 50) {
        if (cal.classList.contains('open')) {
          if (!startBottom) return;   // 캘린더는 언더바에서 시작한 쓸기만 인정
          cal.classList.remove('open');
          phone.classList.remove('in-msg');
        } else if (messages.classList.contains('open')) {
          chat.classList.remove('open');
          messages.classList.remove('open');
          phone.classList.remove('in-msg');
        } else {
          lock.classList.add('up');
        }
      }
    };

    // 화면 크기에 맞춰 폰 크게 키우기
    function fitPhone() {
      const s = Math.min(window.innerWidth / 280, window.innerHeight / 600) * 0.95;
      phone.style.transform = 'scale(' + s + ')';
    }
    fitPhone();
    window.addEventListener('resize', fitPhone);

    // 왼쪽으로 밀면 시간 보이기
    const chatBodyEl = document.getElementById('chatBody');
    let sx = 0, sy = 0, dragging = false, locked = false;

    chatBodyEl.addEventListener('pointerdown', function (e) {
      sx = e.clientX;
      sy = e.clientY;
      dragging = true;
      locked = false;
    });
    chatBodyEl.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      const dx = e.clientX - sx;
      const dy = e.clientY - sy;
      if (!locked && Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy)) {
        locked = true;
        chatBodyEl.classList.add('dragging');
      }
      if (locked) {
        const k = phone.getBoundingClientRect().width / 280;   // 폰 확대 비율 보정
        const v = Math.max(0, Math.min(52, -dx / k));
        chatBodyEl.style.setProperty('--dx', v);
      }
    });
    function endDrag() {
      dragging = false;
      locked = false;
      chatBodyEl.classList.remove('dragging');
      chatBodyEl.style.setProperty('--dx', 0);
    }
    chatBodyEl.addEventListener('pointerup', endDrag);
    chatBodyEl.addEventListener('pointercancel', endDrag);
    chatBodyEl.addEventListener('pointerleave', endDrag);

    // ===== 채팅 입력창 =====
    const inputWrap = document.getElementById('inputWrap');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    // 글자 있으면 마이크 → 전송 버튼
    chatInput.addEventListener('input', function () {
      inputWrap.classList.toggle('typing', chatInput.value.trim() !== '');
    });

    // ===== 자동 답장 =====
    // 트리거 단어가 들어간 문자를 보내면 상대방이 답장해!
    // 대화방 번호: 0 = 최요원, 1 = 백석주 팀장님, 2 = 백일몽 주식회사
    //   words: 이 단어 중 하나라도 들어 있으면 (한 글자도 OK)
    //   reply: 오는 답장 / 여러 개 보내려면 ['첫 번째', '두 번째'] 처럼 써줘
    const autoReplies = {
      0: [
        { words: ['장터국밥', '국밥'], reply: [
          '공주야 이게 무슨 일이지요?',
          '드디어 공주랑 국밥 먹는 날이 오는구나 ㅋㅋ',
          '공주가 무르기 전에 빨리 시켜놔야지',
        ] },
      ],
      1: [
      ],
      2: [
        { words: ['지사', '남해지사', '남해 지사'], reply: `[백일몽 주식회사] 남해 지사 관련 문의 안내
항상 당사를 이용해 주셔서 감사합니다. 남해 지사 관련 모든 문의는 보안 및 지침에 따라 유선 및 모바일 상담이 불가하며, 서면 접수로만 진행되고 있습니다.
■ 제출 안내
 제출 방법: 지정 양식을 통한 서면 접수 (방문 및 우편)
 유의 사항: 본 문자에 대한 답신은 처리되지 않으며, 세부 절차는 사내 인프라망 게시판을 참고해 주시기 바랍니다.
감사합니다.` },
      ],
    };
    const REPLY_DELAY = 1500;   // 답장 오는 시간 (1000 = 1초)

    // 채팅창에 말풍선 하나 추가
    function addBubble(kind, text, timeText) {
      const row = document.createElement('div');
      row.className = 'row ' + kind;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = timeText || '';
      row.appendChild(bubble);
      row.appendChild(time);
      const body = document.getElementById('chatBody');
      body.appendChild(row);
      body.scrollTop = body.scrollHeight;
    }

    function sendMsg() {
      const text = chatInput.value.trim();
      if (!text) return;
      const cur = currentChat;
      const now = '21:17';   // 폰 시간에 맞춰 바꿔줘

      chats[cur].push(['out', text, now]);   // 기억해 두면 나갔다 들어와도 남아 있어
      addBubble('out', text, now);
      contacts[cur].preview = oneLine(text);
      contacts[cur].time = now;
      moveToTop(cur);
      renderList();
      chatInput.value = '';
      inputWrap.classList.remove('typing');

      // 트리거 단어 찾기
      const rules = autoReplies[cur] || [];
      for (let i = 0; i < rules.length; i++) {
        const hit = rules[i].words.some(function (w) { return text.includes(w); });
        if (!hit) continue;
        [].concat(rules[i].reply).forEach(function (r, n) {
          setTimeout(function () {
            receiveMessage(cur, r);
          }, REPLY_DELAY * (n + 1));
        });
        break;   // 먼저 맞은 규칙 하나만 실행
      }
    }

    sendBtn.onclick = sendMsg;
    chatInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') sendMsg();
    });

    // ===== 캘린더 =====
    const cal = document.querySelector('.cal');
    const calApp = document.getElementById('calApp');
    const scroller = document.getElementById('calScroll');

    // 일정 추가하는 법: 아래처럼 한 줄 추가하면 돼!
    //   '년-월-일': [ { title:'제목', start:'12:00', end:'18:00', color:'#007aff', memo:'메모' } ],
    // - start, end를 빼면 '종일'로 나와
    // - color, memo는 안 써도 돼 (color는 #abcdef 6자리로)
    // - 같은 날 일정이 여러 개면 { } 를 쉼표로 이어 붙이면 돼
    // - 같은 날짜를 두 줄로 쓰면 아래 줄만 살아남으니까, 한 줄에 합쳐서 써야 해!
    const events = {
      '2026-9-24': [ { title: '추석 연휴' } ],
      '2026-9-25': [ { title: '추석' } ],
      '2026-9-26': [ { title: '추석 연휴' } ],
      '2026-1-17': [ { title: '3주년', color: '#af52de' } ],
      '2026-1-1': [ { title: '새해첫날' } ],
      '2026-2-16': [ { title: '설날 연휴' } ],
      '2026-2-17': [ { title: '설날' } ],
      '2026-2-18': [ { title: '설날 연휴' } ],
      '2026-3-1': [ { title: '삼일절' } ],
      '2026-3-2': [ { title: '대체공휴일' } ],
      '2026-4-5': [ { title: '식목일' } ],
      '2026-5-1': [ { title: '노동절' } ],
      '2026-5-5': [ { title: '어린이날' } ],
      '2026-5-8': [ { title: '어버이날' } ],
      '2026-5-15': [ { title: '스승의 날' } ],
      '2026-5-24': [ { title: '부처님 오신 날' } ],
      '2026-5-25': [ { title: '대체공휴일' } ],
      '2026-6-3': [ { title: '지방선거일' } ],
      '2026-6-6': [ { title: '현충일' } ],
      '2026-7-17': [ { title: '제헌절' } ],
      '2026-8-15': [ { title: '광복절' } ],
      '2026-8-17': [ { title: '대체공휴일' } ],
      '2026-10-1': [ { title: '국군의 날' } ],
      '2026-10-3': [ { title: '개천절' } ],
      '2026-10-5': [ { title: '대체공휴일' } ],
      '2026-10-9': [ { title: '한글날' } ],
      '2026-12-24': [ { title: '크리스마스 이브' }, { title: '연차', color: '#af52de' } ],
      '2026-12-25': [ { title: '크리스마스' } ],
      '2026-12-31': [ { title: '섣달 그믐날' } ],
      '2026-8-29': [ { title: '생일', color: '#af52de' } ]
    };
    const DEFAULT_COLOR = '#3f9a63';
    const today = '2026-9-7';                    // 빨간 동그라미 날짜
    const firstYear = 2026, firstMonth = 0;      // 시작: 2026년 1월 (0 = 1월)
    const monthCount = 12;                       // 몇 달치 만들지

    const dayNames = ['일', '월', '화', '수', '목', '금', '토'];

    // ===== 날짜 누르면 일정창 =====
    const sheetTitle = document.getElementById('sheetTitle');
    const sheetList = document.getElementById('sheetList');
    let selectedCell = null;

    // 일정창이 열리고 닫혀서 높이가 바뀌어도 보던 달 그대로 유지
    function keepMonth(change) {
      const i = Math.round(scroller.scrollTop / scroller.clientHeight);
      change();
      scroller.scrollTop = i * scroller.clientHeight;
    }
    function closeSheet() {
      if (selectedCell) selectedCell.classList.remove('selected');
      selectedCell = null;
      keepMonth(function () { cal.classList.remove('sheet-open'); });
    }
    const sheet = document.getElementById('calSheet');

    // 아래로 쓸어내리면 일정창 닫기 (회색 막대 / 날짜 제목 부분)
    function enableSwipeDown(el, tapCloses) {
      let from = null;
      function scale() { return phone.getBoundingClientRect().width / 280; }
      function reset() {
        from = null;
        sheet.style.transition = '';
        sheet.style.transform = '';
      }
      el.addEventListener('pointerdown', function (e) {
        from = e.clientY;
        sheet.style.transition = 'none';
        el.setPointerCapture(e.pointerId);
      });
      el.addEventListener('pointermove', function (e) {
        if (from === null) return;
        const dy = Math.max(0, (e.clientY - from) / scale());
        sheet.style.transform = 'translateY(' + dy + 'px)';
      });
      el.addEventListener('pointerup', function (e) {
        if (from === null) return;
        const dy = (e.clientY - from) / scale();
        reset();
        if (dy > 30 || (tapCloses && Math.abs(dy) < 6)) closeSheet();
      });
      el.addEventListener('pointercancel', reset);
    }
    enableSwipeDown(document.getElementById('sheetGrab'), true);
    enableSwipeDown(sheetTitle, false);

    function showDay(cell, y, m, d, dow) {
      if (selectedCell === cell) { closeSheet(); return; }   // 같은 날 또 누르면 닫기
      if (selectedCell) selectedCell.classList.remove('selected');
      selectedCell = cell;
      cell.classList.add('selected');

      sheetTitle.textContent = (m + 1) + '월 ' + d + '일 ' + dayNames[dow] + '요일';
      sheetList.innerHTML = '';

      const list = events[y + '-' + (m + 1) + '-' + d] || [];
      if (list.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'ev-empty';
        empty.textContent = '일정 없음';
        sheetList.appendChild(empty);
      }
      list.forEach(function (e) {
        const row = document.createElement('div');
        row.className = 'ev-row';

        const time = document.createElement('div');
        time.className = 'ev-time';
        const t1 = document.createElement('b');
        t1.textContent = e.start || '종일';
        time.appendChild(t1);
        if (e.start && e.end) {
          const t2 = document.createElement('span');
          t2.textContent = e.end;
          time.appendChild(t2);
        }

        const bar = document.createElement('div');
        bar.className = 'ev-bar';
        bar.style.background = e.color || DEFAULT_COLOR;

        const text = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'ev-title';
        title.textContent = e.title;
        text.appendChild(title);
        if (e.memo) {
          const memo = document.createElement('div');
          memo.className = 'ev-memo';
          memo.textContent = e.memo;
          text.appendChild(memo);
        }

        row.appendChild(time);
        row.appendChild(bar);
        row.appendChild(text);
        sheetList.appendChild(row);
      });

      if (!cal.classList.contains('sheet-open')) {
        keepMonth(function () { cal.classList.add('sheet-open'); });
      }
    }

    for (let n = 0; n < monthCount; n++) {
      const y = firstYear + Math.floor((firstMonth + n) / 12);
      const m = (firstMonth + n) % 12;
      const offset = new Date(y, m, 1).getDay();
      const lastDay = new Date(y, m + 1, 0).getDate();
      const rows = Math.ceil((offset + lastDay) / 7);

      const box = document.createElement('div');
      box.className = 'cal-month';

      const title = document.createElement('div');
      title.className = 'cal-title';
      title.textContent = (y === firstYear ? '' : y + '년 ') + (m + 1) + '월';
      box.appendChild(title);

      const week = document.createElement('div');
      week.className = 'cal-week';
      week.innerHTML = dayNames.map(function (d) { return '<span>' + d + '</span>'; }).join('');
      box.appendChild(week);

      const grid = document.createElement('div');
      grid.className = 'cal-grid';
      grid.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';

      for (let i = 0; i < offset; i++) {
        const blank = document.createElement('div');
        blank.className = 'cal-cell';
        grid.appendChild(blank);
      }
      for (let d = 1; d <= lastDay; d++) {
        const key = y + '-' + (m + 1) + '-' + d;
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        const dow = (offset + d - 1) % 7;
        if (dow === 0 || dow === 6) cell.classList.add('off');
        if (key === today) cell.classList.add('today');

        const num = document.createElement('div');
        num.className = 'cal-num';
        num.textContent = d;
        cell.appendChild(num);

        const list = events[key] || [];
        if (list.length > 0) {
          const first = list[0];
          const c = first.color || DEFAULT_COLOR;
          const chip = document.createElement('div');
          chip.className = 'cal-ev';
          chip.style.background = c + '40';
          const dot = document.createElement('i');
          dot.style.background = c;
          chip.appendChild(dot);
          chip.appendChild(document.createTextNode(first.title));
          cell.appendChild(chip);
          if (list.length > 1) {
            const more = document.createElement('div');
            more.className = 'cal-more';
            more.textContent = '+' + (list.length - 1);
            cell.appendChild(more);
          }
        }
        cell.onclick = function () { showDay(cell, y, m, d, dow); };
        grid.appendChild(cell);
      }
      box.appendChild(grid);
      scroller.appendChild(box);
    }

    // 처음엔 오늘이 있는 달로 이동
    const t = today.split('-');
    const idx = (Number(t[0]) - firstYear) * 12 + (Number(t[1]) - 1) - firstMonth;
    scroller.scrollTop = idx * scroller.clientHeight;

    calApp.onclick = function () {
      cal.classList.add('open');
      phone.classList.add('in-msg');
    };

    // 입력창 눌렀다 닫을 때 화면이 밀려 있으면 제자리로
    chatInput.addEventListener('focus', function () {
      setTimeout(function () { window.scrollTo(0, 0); }, 50);
    });
    chatInput.addEventListener('blur', function () {
      window.scrollTo(0, 0);
    });
  </script>
</body>
</html>
