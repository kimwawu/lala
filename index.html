<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
      font-family: "Pretendard", sans-serif;
    }
    .phone {
      overflow: hidden;
      position: relative;
      width: 280px;
      height: 600px;
      background-image: url(https://cdn.discordapp.com/attachments/1161239105489866772/1561390092575318138/IMG_4169.png?ex=6ad62d57&is=6ad4dbd7&hm=c14f8811235b73568cf82a8f621ed3232447c9ea80b1833e17036920f8efbd96&);
      background-size: cover;
      background-repeat: no-repeat;
      border-radius: 40px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      touch-action: none;
    }

    /* --- [추가] 홈 화면 및 독(Dock) 바 스타일 --- */
    .home-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 60px 16px 20px 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* 하단 독(Dock) 바 */
    .dock {
      width: 100%;
      height: 68px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 30px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.3);
      margin-bottom: 12px;
    }

    /* 독 아이콘 공통 */
    .dock-icon {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 11px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    /* 전화 아이콘 */
    .icon-phone {
      background: linear-gradient(180deg, #63E660 0%, #34C759 100%);
    }
    /* 카카오톡 아이콘 */
    .icon-talk {
      background: #FEE500;
    }
    /* 메시지 아이콘 */
    .icon-message {
      background: linear-gradient(180deg, #63E660 0%, #34C759 100%);
    }
    /* 사파리 아이콘 */
    .icon-safari {
      background: #FFFFFF;
    }

    /* 알림 뱃지 */
    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #FF3B30;
      color: white;
      font-size: 11px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 4px;
      box-sizing: border-box;
      border: 1.5px solid #FFFFFF;
      line-height: 1;
    }
    /* --------------------------------------------- */

    .lock {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      background-image: url(https://cdn.discordapp.com/attachments/1161239105489866772/1561390092575318138/IMG_4169.png?ex=6ad62d57&is=6ad4dbd7&hm=c14f8811235b73568cf82a8f621ed3232447c9ea80b1833e17036920f8efbd96&);
