<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
      font-family: "Pretendard", sans-serif;
    }
    .phone {
      overflow: hidden;
      position: relative;
      width: 280px;
      height: 600px;
      background-image: url(https://cdn.discordapp.com/attachments/1161239105489866772/1561390092575318138/IMG_4169.png?ex=6ad62d57&is=6ad4dbd7&hm=c14f8811235b73568cf82a8f621ed3232447c9ea80b1833e17036920f8efbd96&);
      background-size: cover;
      background-repeat: no-repeat;
      border-radius: 40px;
      box-shadow: 0 10px 20px rgba(255,255,255,0.2);
      touch-action: none;
    }
    .lock {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      background-image: url(https://cdn.discordapp.com/attachments/1161239105489866772/1561390092575318138/IMG_4169.png?ex=6ad62d57&is=6ad4dbd7&hm=c14f8811235b73568cf82a8f621ed3232447c9ea80b1833e17036920f8efbd96&);
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
      user-select: none;
      transition: transform 0.5s;
    }
    .lock.up {
      transform: translateY(-100%);
    }
    .lock-date {
      margin-top: 50px;
      font-size: 18px;
      font-weight: 600;
      opacity: 0.8;
    }
    .lock-time {
      font-size: 95px;
      font-weight: 600;
      opacity: 0.8;
      line-height: 1;
      margin-top: -6px;
      letter-spacing: -5px;
    }
    .lock-btn {
      position: absolute;
      bottom: 40px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s;
    }
    .lock-btn.left {
      left: 30px;
    }
    .lock-btn.right {
      right: 30px;
    }
    .lock-btn:active {
      transform: scale(1.2);
    }
    .island {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 23px;
      background: black;
      border-radius: 20px;
    }
    .bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 5px;
      background: white;
      opacity: 0.5;
      border-radius: 3px;
      transition: width 0.2s;
    }
    .bar:active {
      width: 125px;
    }
    .status {
      position: absolute;
      top: 13px;
      left: 0;
      right: 0;
      height: 26px;
      padding-left: 42px;
      padding-right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      font-size: 15px;
      font-weight: 600;
    }
    .icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dock {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 249px;
      height: 70px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      justify-content: center;
      gap: 10px;
      align-items: center;
    }
    .app {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      overflow: hidden;
    }
    .calendar {
      container-type: size;
      background: linear-gradient(#ffffff, #f0f0f0);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1px;
      cursor: pointer;
      box-sizing: border-box;
      padding-top: 6px;
    }
    .calendar .day {
      font-size: 19cqw;
      font-weight: 700;
      color: #1c1c1e;
      line-height: 1;
    }
    .calendar .num {
      font-size: 58cqw;
      font-weight: 300;
      color: #333;
      line-height: 1;
    }
    .app img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .messages {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      background: white;
      color: black;
      user-select: none;
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }
    .messages.open {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .msg-title {
      margin: 62px 16px 8px;
      font-size: 30px;
      font-weight: 700;
    }
    .msg-search {
      margin: 0 16px 8px;
      height: 32px;
      border-radius: 10px;
      background: #eeeef0;
      color: #8e8e93;
      font-size: 14px;
      display: flex;
      align-items: center;
      padding-left: 12px;
      box-sizing: border-box;
    }
    .msg-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      cursor: pointer;
    }
    .msg-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(#a5aab5, #858a95);
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 18px;
      font-weight: 600;
    }
    .msg-text {
      flex: 1;
      min-width: 0;
    }
    .msg-name {
      font-size: 14px;
      font-weight: 600;
    }
    .msg-preview {
      font-size: 13px;
      color: #8e8e93;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .msg-time {
      font-size: 12px;
      color: #8e8e93;
    }
    .phone.in-msg .status { color: black; }
    .phone.in-msg .bar { background: black; }

    .chat {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      background: white;
      color: black;
      user-select: none;
      transform: translateX(100%);
      pointer-events: none;
      transition: transform 0.3s;
    }
    .chat.open {
      transform: translateX(0);
      pointer-events: auto;
    }
    .chat-head {
      position: relative;
      height: 96px;
      box-sizing: border-box;
      padding-top: 42px;
      text-align: center;
      background: #f9f9f9;
      border-bottom: 1px solid #e5e5ea;
      border-radius: 40px 40px 0 0;
    }
    .chat-head .msg-avatar {
      width: 32px;
      height: 32px;
      font-size: 14px;
      margin: 0 auto 2px;
    }
    .chat-name {
      font-size: 11px;
    }
    .chat-back {
      position: absolute;
      left: 14px;
      top: 52px;
      color: #007aff;
      font-size: 15px;
      cursor: pointer;
    }
    .chat-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bubble {
      max-width: 75%;
      padding: 7px 12px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.3;
    }
    .bubble.in {
      background: #e9e9eb;
      align-self: flex-start;
    }
    .bubble.out {
      background: #007aff;
      color: white;
      align-self: flex-end;
    }
  </style>
</head>
<body>
  <div class="phone">

    <div class="dock">
      <a class="app">
        <img src="https://cdn.discordapp.com/attachments/1161239105489866772/1561423134018769089/BqZSmq8DEIVmrsrM2ZjJFk4Ly7VN2w9eDFvVYWUkt2hI_bMNRo2Fvymz_lDWJ6BUwEQeLXW9T5jxN3hOb_qeN6o6Bm_-VuBr_uryFg5DKs6oVzamsOoqI7iImzoaxB5Z7iza1bHVkSWmcCViFSDmRg.webp?ex=6ad64c1c&is=6ad4fa9c&hm=60abe7b69df9cca358ea2696c94408be7e93f034af8d37033aec92c50144f3e2&">
      </a>
      <div class="app calendar">
        <div class="day">월요일</div>
        <div class="num">7</div>
      </div>
      <a class="app" id="msgApp">
        <img src="https://cdn.discordapp.com/attachments/1161239105489866772/1561414546885836890/png-clipart-computer-icons-imessage-imessage-leaf-logo-thumbnail.png?ex=6ad6441d&is=6ad4f29d&hm=e07576a2f1593937e0522d02fe4365644e81e1beaa08f417ac172d2cf0ac4670&">
      </a>
      <a class="app" href="https://www.daydreamcorp.space/ko" target="_blank">
        <img src="https://cdn.discordapp.com/attachments/1161239105489866772/1561413157400879317/safari_ios_browser_logo_icon_152966.png?ex=6ad642d2&is=6ad4f152&hm=a6238df4726db263a304a32f29ab37ab867813a19ebcf1e95ec0b652ec57dc43&">
      </a>
    </div>

    <div class="lock">
      <div class="lock-date">9월 7일 (월)</div>
      <div class="lock-time">21:17</div>
      <div class="lock-btn left">
        <svg width="20" height="24" viewBox="0 0 20 24" fill="white">
          <rect x="3" y="0" width="14" height="5" rx="1.5"/>
          <path d="M5 7h10v13a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/>
          <rect x="8.5" y="11" width="3" height="6" rx="1.5" fill="rgba(0,0,0,0.35)"/>
        </svg>
      </div>
      <div class="lock-btn right">
        <svg width="24" height="20" viewBox="0 0 24 20" fill="white">
          <path d="M8 2l1.5-2h5L16 2h4a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3z"/>
          <circle cx="12" cy="10.5" r="4.5" fill="rgba(0,0,0,0.35)"/>
        </svg>
      </div>
    </div>

    <div class="messages">
      <div class="msg-title">메시지</div>
      <div class="msg-search">검색</div>

      <div class="msg-item">
        <div class="msg-avatar">백</div>
        <div class="msg-text">
          <div class="msg-name">백일몽 주식회사</div>
          <div class="msg-preview">[백일몽 주식회사 | 복지몰 구매 안내]</div>
        </div>
        <div class="msg-time">오전 11:32</div>
      </div>

      <div class="msg-item">
        <div class="msg-avatar">최</div>
        <div class="msg-text">
          <div class="msg-name">최요원</div>
          <div class="msg-preview">공주 오늘 퇴근 언제야</div>
        </div>
        <div class="msg-time">오후 6:42</div>
      </div>

      <div class="msg-item">
        <div class="msg-avatar">엄</div>
        <div class="msg-text">
          <div class="msg-name">엄마</div>
          <div class="msg-preview">밥 먹었니?</div>
        </div>
        <div class="msg-time">어제</div>
      </div>
    </div>

    <div class="chat">
      <div class="chat-head">
        <div class="chat-back">‹ 메시지</div>
        <div class="msg-avatar" id="chatAvatar">백</div>
        <div class="chat-name" id="chatName">백일몽 주식회사</div>
      </div>
      <div class="chat-body" id="chatBody"></div>
    </div>

    <div class="island"></div>
    <div class="bar"></div>
    <div class="status">
      <span>21:17</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
          <rect y="8" width="3" height="4" rx="1"/>
          <rect x="5" y="5.5" width="3" height="6.5" rx="1"/>
          <rect x="10" y="3" width="3" height="9" rx="1"/>
          <rect x="15" width="3" height="12" rx="1"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M1 4.5a10 10 0 0 1 14 0M3.5 7.3a6.5 6.5 0 0 1 9 0"/>
          <circle cx="8" cy="10" r="0.8" fill="currentColor"/>
        </svg>
        <svg width="27" height="12" viewBox="0 0 27 12">
          <rect x="0.5" y="0.5" width="23" height="11" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/>
          <rect x="2" y="2" width="5" height="8" rx="2" fill="currentColor"/>
          <path d="M25 4v4c0.8-0.3 1.5-1.1 1.5-2S25.8 4.3 25 4z" fill="currentColor" opacity="0.5"/>
        </svg>
      </span>
    </div>

  </div>

  <script>
    const phone = document.querySelector('.phone');
    const lock = document.querySelector('.lock');
    const messages = document.querySelector('.messages');
    const chat = document.querySelector('.chat');
    const msgApp = document.getElementById('msgApp');
    let startY = 0;

    // 대화 내용 (목록 위에서부터 순서대로)
    // 'in' = 받은 말풍선(회색), 'out' = 보낸 말풍선(파란색)
    const chats = [
      // 백일몽 주식회사
      [
        ['in', '[백일몽 주식회사 | 복지몰 구매 안내]

안녕하세요, 백일몽 주식회사 복지지원팀입니다.

요청하신 복지몰 상품 구매가 정상적으로 완료되어 안내드립니다.

■ 구매내역

상품명: 진통제

결제수단: 임직원 복지 포인트

사용 포인트: 5,000P

잔여 포인트: 복지몰 마이페이지에서 확인 가능

구매 내역 및 상품 관련 문의는 사내 복지몰 고객센터를 통해 확인하실 수 있습니다.

백일몽 주식회사는 임직원의 건강하고 편안한 일상을 응원합니다.
감사합니다.'],
      ],
      // 최요원
      [
        ['in', '공주 오늘 퇴근 언제야'],
        ['out', 'ㅁㄹ 늦을 듯'],
        ['in', 'ㅠㅠ 저녁 같이 먹고 싶은데'],
      ],
      // 백석주 팀장님
      [
        ['in', '오늘 들어간 괴담 관련해서 전화 좀 하자'],
        ['in', '등급 조정 좀 해야 될 것 같네'],
      ],
    ];

    // 3번째 네모 누르면 메시지 목록 열기
    msgApp.onclick = function () {
      messages.classList.add('open');
      phone.classList.add('in-msg');
    };

    // 대화 누르면 채팅 화면 열기
    document.querySelectorAll('.msg-item').forEach(function (item, i) {
      item.onclick = function () {
        document.getElementById('chatAvatar').textContent = item.querySelector('.msg-avatar').textContent;
        document.getElementById('chatName').textContent = item.querySelector('.msg-name').textContent;

        const body = document.getElementById('chatBody');
        body.innerHTML = '';
        chats[i].forEach(function (m) {
          const bubble = document.createElement('div');
          bubble.className = 'bubble ' + m[0];
          bubble.textContent = m[1];
          body.appendChild(bubble);
        });

        chat.classList.add('open');
      };
    });

    // 뒤로가기
    document.querySelector('.chat-back').onclick = function () {
      chat.classList.remove('open');
    };

    // 위로 쓸기: 잠금 해제 / 홈으로
    phone.onpointerdown = function (e) {
      startY = e.clientY;
    };
    phone.onpointerup = function (e) {
      if (startY - e.clientY > 50) {
        if (messages.classList.contains('open')) {
          chat.classList.remove('open');
          messages.classList.remove('open');
          phone.classList.remove('in-msg');
        } else {
          lock.classList.add('up');
        }
      }
    };
  </script>
</body>
</html>
