<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
      font-family: "Pretendard", sans-serif;
      overflow: hidden;
    }
    .phone {
      overflow: hidden;
      position: relative;
      width: 280px;
      height: 600px;
      background-image: url(https://cdn.discordapp.com/attachments/1161239105489866772/1561390092575318138/IMG_4169.png?ex=6ad62d57&is=6ad4dbd7&hm=c14f8811235b73568cf82a8f621ed3232447c9ea80b1833e17036920f8efbd96&);
      background-size: cover;
      background-repeat: no-repeat;
      border-radius: 40px;
      box-shadow: 0 10px 20px rgba(255,255,255,0.2);
    }
    .lock {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      background-image: url(https://cdn.discordapp.com/attachments/1161239105489866772/1561390092575318138/IMG_4169.png?ex=6ad62d57&is=6ad4dbd7&hm=c14f8811235b73568cf82a8f621ed3232447c9ea80b1833e17036920f8efbd96&);
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
      user-select: none;
      transition: transform 0.5s;
      touch-action: none;
    }
    .lock.up {
      transform: translateY(-100%);
    }
    .lock-date {
      margin-top: 50px;
      font-size: 18px;
      font-weight: 600;
      opacity: 0.8;
    }
    .lock-time {
      font-size: 95px;
      font-weight: 600;
      opacity: 0.8;
      line-height: 1;
      margin-top: -6px;
      letter-spacing: -5px;
    }
    .lock-btn {
      position: absolute;
      bottom: 40px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s;
    }
    .lock-btn.left {
      left: 30px;
    }
    .lock-btn.right {
      right: 30px;
    }
    .lock-btn:active {
      transform: scale(1.2);
    }
    .island {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 23px;
      background: black;
      border-radius: 20px;
    }
    .bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 5px;
      background: white;
      opacity: 0.5;
      border-radius: 3px;
      transition: width 0.2s;
    }
    .bar:active {
      width: 125px;
    }
    .status {
      position: absolute;
      top: 13px;
      left: 0;
      right: 0;
      height: 26px;
      padding-left: 42px;
      padding-right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      font-size: 15px;
      font-weight: 600;
    }
    .icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dock {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 249px;
      height: 70px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      justify-content: center;
      gap: 10px;
      align-items: center;
    }
    .app {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      overflow: hidden;
    }
    .calendar {
      container-type: size;
      background: linear-gradient(#ffffff, #f0f0f0);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1px;
      cursor: pointer;
      box-sizing: border-box;
      padding-top: 6px;
    }
    .calendar .day {
      font-size: 19cqw;
      font-weight: 700;
      color: #1c1c1e;
      line-height: 1;
    }
    .calendar .num {
      font-size: 58cqw;
      font-weight: 300;
      color: #333;
      line-height: 1;
    }
    .app img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .messages {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      background: white;
      color: black;
      user-select: none;
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      touch-action: none;
    }
    .messages.open {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .msg-title {
      margin: 62px 16px 8px;
      font-size: 30px;
      font-weight: 700;
    }
    .msg-search {
      margin: 0 16px 8px;
      height: 32px;
      border-radius: 10px;
      background: #eeeef0;
      color: #8e8e93;
      font-size: 14px;
      display: flex;
      align-items: center;
      padding-left: 12px;
      box-sizing: border-box;
    }
    .msg-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      cursor: pointer;
    }
    .msg-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(#a5aab5, #858a95);
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 18px;
      font-weight: 600;
    }
    .msg-text {
      flex: 1;
      min-width: 0;
    }
    .msg-name {
      font-size: 14px;
      font-weight: 600;
    }
    .msg-preview {
      font-size: 13px;
      color: #8e8e93;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .msg-time {
      font-size: 12px;
      color: #8e8e93;
    }
    .phone.in-msg .status { color: black; }
    .phone.in-msg .bar { background: black; }

    .chat {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      background: white;
      color: black;
      user-select: none;
      transform: translateX(100%);
      pointer-events: none;
      transition: transform 0.3s;
      display: flex;
      flex-direction: column;
    }
    .chat.open {
      transform: translateX(0);
      pointer-events: auto;
    }
    .chat-head {
      position: relative;
      height: 96px;
      box-sizing: border-box;
      padding-top: 42px;
      text-align: center;
      background: #f9f9f9;
      border-bottom: 1px solid #e5e5ea;
      border-radius: 40px 40px 0 0;
      flex-shrink: 0;
    }
    .chat-head .msg-avatar {
      width: 32px;
      height: 32px;
      font-size: 14px;
      margin: 0 auto 2px;
    }
    .chat-name {
      font-size: 11px;
    }
    .chat-back {
      position: absolute;
      left: 14px;
      top: 52px;
      color: #007aff;
      font-size: 15px;
      cursor: pointer;
    }
    .chat-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      touch-action: pan-y;
      padding: 12px 12px 30px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scrollbar-width: none;
    }
    .row {
      position: relative;
      display: flex;
      width: 100%;
      flex-shrink: 0;
      transform: translateX(calc(var(--dx, 0) * -1px));
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .row.in  { justify-content: flex-start; }
    .row.out { justify-content: flex-end; }
    .chat-body.dragging .row { transition: none; }

    .bubble {
      max-width: 75%;
      padding: 7px 12px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.3;
      white-space: pre-wrap;
    }
    .row.in .bubble  { background: #e9e9eb; }
    .row.out .bubble { background: #007aff; color: white; }

    .time {
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      padding-left: 8px;
      box-sizing: border-box;
      font-size: 11px;
      color: #8e8e93;
      white-space: nowrap;
      pointer-events: none;
      opacity: calc(var(--dx, 0) / 52);
      transition: opacity 0.3s;
    }
    .chat-body.dragging .time { transition: none; }

    /* ===== 채팅 입력창 ===== */
    .chat-input {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 26px;
      background: white;
      flex-shrink: 0;
    }
    .plus-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 1px 6px rgba(0,0,0,0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      cursor: pointer;
    }
    .input-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 32px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 1px 6px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
    }
    .input-wrap input {
      flex: 1;
      width: 100%;
      min-width: 0;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      padding: 0 38px 0 12px;
      user-select: text;
      caret-color: #3b86f7;
    }
    .input-wrap input::placeholder {
      color: #c0c0c5;
    }
    .mic {
      position: absolute;
      right: 10px;
      display: flex;
    }
    .send {
      position: absolute;
      right: 3px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #3b86f7;
      display: none;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .input-wrap.typing .mic { display: none; }
    .input-wrap.typing .send { display: flex; }

    /* ===== 캘린더 ===== */
    .cal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      background: white;
      color: black;
      user-select: none;
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .cal.open {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .cal-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      overscroll-behavior: contain;
    }
    .cal-scroll::-webkit-scrollbar { display: none; }
    .cal-month {
      height: 100%;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      padding-bottom: 22px;
      box-sizing: border-box;
    }
    .cal-title {
      margin: 58px 16px 6px;
      font-size: 30px;
      font-weight: 800;
    }
    .cal-week {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      padding-bottom: 4px;
    }
    .cal-week span:first-child,
    .cal-week span:last-child { color: #8e8e93; }
    .cal-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .cal-cell {
      border-top: 1px solid #e5e5ea;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 4px;
      min-width: 0;
    }
    .cal-cell.off { color: #8e8e93; }
    .cal-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 17px;
      font-weight: 600;
    }
    .cal-cell.today .cal-num {
      background: #ff3b30;
      color: white;
    }
    .cal-ev {
      margin-top: 4px;
      width: calc(100% - 2px);
      height: 14px;
      border-radius: 7px;
      background: #c9e6d6;
      color: #2d5a3f;
      font-size: 8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 3px;
      box-sizing: border-box;
      white-space: nowrap;
      overflow: hidden;
    }
    .cal-ev i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3f9a63;
      flex-shrink: 0;
    }
    .home-zone {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 36px;
      touch-action: none;
      z-index: 5;
    }

    /* ===== 날짜 눌렀을 때 아래에 뜨는 일정창 ===== */
    .cal-cell { cursor: pointer; overflow: hidden; }
    .cal-cell.selected .cal-num { background: #1c1c1e; color: white; }
    .cal-cell.today .cal-num { background: #ff3b30; color: white; }
    .cal-more {
      margin-top: 2px;
      font-size: 8px;
      color: #8e8e93;
      line-height: 1;
    }
    .cal.sheet-open .cal-title { margin-top: 48px; font-size: 24px; }
    .cal.sheet-open .cal-month { padding-bottom: 4px; }
    .cal-sheet {
      transition: transform 0.2s;
      display: none;
      height: 220px;
      flex-shrink: 0;
      background: white;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
      padding: 0 16px 34px;
      box-sizing: border-box;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .cal.sheet-open .cal-sheet { display: block; }
    .sheet-grab { padding: 14px 0 12px; cursor: pointer; touch-action: none; }
    .sheet-bar {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: #d1d1d6;
      margin: 0 auto;
    }
    .sheet-title {
      touch-action: none;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .ev-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      align-items: stretch;
    }
    .ev-time {
      width: 34px;
      flex-shrink: 0;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .ev-time b { font-weight: 600; color: #1c1c1e; }
    .ev-time span { color: #8e8e93; }
    .ev-bar {
      width: 3px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .ev-title { font-size: 14px; font-weight: 600; }
    .ev-memo { font-size: 11px; color: #8e8e93; margin-top: 2px; }
    .ev-empty { font-size: 13px; color: #8e8e93; }
  </style>
</head>

      });

      if (!cal.classList.contains('sheet-open')) {
        keepMonth(function () { cal.classList.add('sheet-open'); });
      }
    }

    for (let n = 0; n < monthCount; n++) {
      const y = firstYear + Math.floor((firstMonth + n) / 12);
      const m = (firstMonth + n) % 12;
      const offset = new Date(y, m, 1).getDay();
      const lastDay = new Date(y, m + 1, 0).getDate();
      const rows = Math.ceil((offset + lastDay) / 7);

      const box = document.createElement('div');
      box.className = 'cal-month';

      const title = document.createElement('div');
      title.className = 'cal-title';
      title.textContent = (y === firstYear ? '' : y + '년 ') + (m + 1) + '월';
      box.appendChild(title);

      const week = document.createElement('div');
      week.className = 'cal-week';
      week.innerHTML = dayNames.map(function (d) { return '<span>' + d + '</span>'; }).join('');
      box.appendChild(week);

      const grid = document.createElement('div');
      grid.className = 'cal-grid';
      grid.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';

      for (let i = 0; i < offset; i++) {
        const blank = document.createElement('div');
        blank.className = 'cal-cell';
        grid.appendChild(blank);
      }
      for (let d = 1; d <= lastDay; d++) {
        const key = y + '-' + (m + 1) + '-' + d;
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        const dow = (offset + d - 1) % 7;
        if (dow === 0 || dow === 6) cell.classList.add('off');
        if (key === today) cell.classList.add('today');

        const num = document.createElement('div');
        num.className = 'cal-num';
        num.textContent = d;
        cell.appendChild(num);

        const list = events[key] || [];
        if (list.length > 0) {
          const first = list[0];
          const c = first.color || DEFAULT_COLOR;
          const chip = document.createElement('div');
          chip.className = 'cal-ev';
          chip.style.background = c + '40';
          const dot = document.createElement('i');
          dot.style.background = c;
          chip.appendChild(dot);
          chip.appendChild(document.createTextNode(first.title));
          cell.appendChild(chip);
          if (list.length > 1) {
            const more = document.createElement('div');
            more.className = 'cal-more';
            more.textContent = '+' + (list.length - 1);
            cell.appendChild(more);
          }
        }
        cell.onclick = function () { showDay(cell, y, m, d, dow); };
        grid.appendChild(cell);
      }
      box.appendChild(grid);
      scroller.appendChild(box);
    }

    // 처음엔 오늘이 있는 달로 이동
    const t = today.split('-');
    const idx = (Number(t[0]) - firstYear) * 12 + (Number(t[1]) - 1) - firstMonth;
    scroller.scrollTop = idx * scroller.clientHeight;

    calApp.onclick = function () {
      cal.classList.add('open');
      phone.classList.add('in-msg');
    };
  </script>
</body>
</html>
