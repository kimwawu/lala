<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
      font-family: "Pretendard", sans-serif;
    }
    .phone {
      overflow: hidden;
      position: relative;
      width: 280px;
      height: 600px;
      background-image: url(https://cdn.discordapp.com/attachments/1161239105489866772/1561390092575318138/IMG_4169.png?ex=6ad62d57&is=6ad4dbd7&hm=c14f8811235b73568cf82a8f621ed3232447c9ea80b1833e17036920f8efbd96&);
      background-size: cover;
      background-repeat: no-repeat;
      border-radius: 40px;
      box-shadow: 0 10px 20px rgba(255,255,255,0.2);
      touch-action: none;
    }
    .lock {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      background-image: url(https://cdn.discordapp.com/attachments/1161239105489866772/1561390092575318138/IMG_4169.png?ex=6ad62d57&is=6ad4dbd7&hm=c14f8811235b73568cf82a8f621ed3232447c9ea80b1833e17036920f8efbd96&);
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
      user-select: none;
      transition: transform 0.5s;
    }
    .lock.up {
      transform: translateY(-100%);
    }
    .lock-date {
      margin-top: 50px;
      font-size: 18px;
      font-weight: 600;
      opacity: 0.8;
    }
    .lock-time {
      font-size: 95px;
      font-weight: 600;
      opacity: 0.8;
      line-height: 1;
      margin-top: -6px;
      letter-spacing: -5px;
    }
    .lock-btn {
      position: absolute;
      bottom: 40px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s;
    }
    .lock-btn.left {
      left: 30px;
    }
    .lock-btn.right {
      right: 30px;
    }
    .lock-btn:active {
      transform: scale(1.2);
    }
    .island {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 23px;
      background: black;
      border-radius: 20px;
    }
    .bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 5px;
      background: white;
      opacity: 0.5;
      border-radius: 3px;
      transition: width 0.2s;
    }
    .bar:active {
      width: 125px;
    }
    .status {
      position: absolute;
      top: 13px;
      left: 0;
      right: 0;
      height: 26px;
      padding-left: 42px;
      padding-right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      font-size: 15px;
      font-weight: 600;
    }
    .icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dock {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 249px;
      height: 70px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      justify-content: center;
      gap: 10px;
      align-items: center;
    }
    .app {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      overflow: hidden;
    }
    .calendar {
      container-type: size;
      background: linear-gradient(#ffffff, #f0f0f0);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      box-sizing: border-box;
      padding-top: 8px;
    }
    .calendar .day {
      font-size: 19cqw;
      font-weight: 700;
      color: #1c1c1e;
      line-height: 1;
    }
    .calendar .num {
      font-size: 58cqw;
      font-weight: 300;
      color: #333;
      line-height: 1;
    }
    .app img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ===== 메시지 화면 ===== */
    .messages {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      background: white;
      color: black;
      user-select: none;
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }
    .messages.open {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .msg-title {
      margin: 62px 16px 8px;
      font-size: 30px;
      font-weight: 700;
    }
    .msg-search {
      margin: 0 16px 8px;
      height: 32px;
      border-radius: 10px;
      background: #eeeef0;
      color: #8e8e93;
      font-size: 14px;
      display: flex;
      align-items: center;
      padding-left: 12px;
      box-sizing: border-box;
    }
    .msg-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
    }
    .msg-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #c7c7cc;
      flex-shrink: 0;
    }
    .msg-text {
      flex: 1;
      min-width: 0;
    }
    .msg-name {
      font-size: 14px;
      font-weight: 600;
    }
    .msg-preview {
      font-size: 13px;
      color: #8e8e93;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .msg-time {
      font-size: 12px;
      color: #8e8e93;
    }
    /* 메시지 화면이 열리면 상태바/홈바를 검정색으로 */
    .phone.in-msg .status { color: black; }
    .phone.in-msg .bar { background: black; }
  </style>
</head>
<body>
  <div class="phone">

    <div class="dock">
      <a class="app">
        <img src="https://cdn.discordapp.com/attachments/1161239105489866772/1561417960868937819/16566077.png?ex=6ad6474b&is=6ad4f5cb&hm=30ed0f9e6dcc79771b911a9e1c1cdc90ddcb62889771829791710674a0f240df&">
      </a>
      <div class="app calendar">
        <div class="day">월요일</div>
        <div class="num">7</div>
      </div>
      <a class="app" id="msgApp">
        <img src="https://cdn.discordapp.com/attachments/1161239105489866772/1561414546885836890/png-clipart-computer-icons-imessage-imessage-leaf-logo-thumbnail.png?ex=6ad6441d&is=6ad4f29d&hm=e07576a2f1593937e0522d02fe4365644e81e1beaa08f417ac172d2cf0ac4670&">
      </a>
      <a class="app" href="https://www.daydreamcorp.space/ko" target="_blank">
        <img src="https://cdn.discordapp.com/attachments/1161239105489866772/1561413157400879317/safari_ios_browser_logo_icon_152966.png?ex=6ad642d2&is=6ad4f152&hm=a6238df4726db263a304a32f29ab37ab867813a19ebcf1e95ec0b652ec57dc43&">
      </a>
    </div>

    <div class="lock">
      <div class="lock-date">9월 7일 (월)</div>
      <div class="lock-time">21:17</div>
      <div class="lock-btn left">
        <svg width="20" height="24" viewBox="0 0 20 24" fill="white">
          <rect x="3" y="0" width="14" height="5" rx="1.5"/>
          <path d="M5 7h10v13a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/>
          <rect x="8.5" y="11" width="3" height="6" rx="1.5" fill="rgba(0,0,0,0.35)"/>
        </svg>
      </div>
      <div class="lock-btn right">
        <svg width="24" height="20" viewBox="0 0 24 20" fill="white">
          <path d="M8 2l1.5-2h5L16 2h4a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3z"/>
          <circle cx="12" cy="10.5" r="4.5" fill="rgba(0,0,0,0.35)"/>
        </svg>
      </div>
    </div>

    <div class="messages">
      <div class="msg-title">메시지</div>
      <div class="msg-search">검색</div>

      <div class="msg-item">
        <div class="msg-avatar"></div>
        <div class="msg-text">
          <div class="msg-name">친구1</div>
          <div class="msg-preview">오늘 저녁에 뭐해?</div>
        </div>
        <div class="msg-time">오후 9:10</div>
      </div>

      <div class="msg-item">
        <div class="msg-avatar"></div>
        <div class="msg-text">
          <div class="msg-name">친구2</div>
          <div class="msg-preview">ㅋㅋㅋㅋ 그거 봤어?</div>
        </div>
        <div class="msg-time">오후 6:42</div>
      </div>

      <div class="msg-item">
        <div class="msg-avatar"></div>
        <div class="msg-text">
          <div class="msg-name">엄마</div>
          <div class="msg-preview">밥 먹었니?</div>
        </div>
        <div class="msg-time">어제</div>
      </div>
    </div>

    <div class="island"></div>
    <div class="bar"></div>
    <div class="status">
      <span>21:17</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
          <rect y="8" width="3" height="4" rx="1"/>
          <rect x="5" y="5.5" width="3" height="6.5" rx="1"/>
          <rect x="10" y="3" width="3" height="9" rx="1"/>
          <rect x="15" width="3" height="12" rx="1"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M1 4.5a10 10 0 0 1 14 0M3.5 7.3a6.5 6.5 0 0 1 9 0"/>
          <circle cx="8" cy="10" r="0.8" fill="currentColor"/>
        </svg>
        <svg width="27" height="12" viewBox="0 0 27 12">
          <rect x="0.5" y="0.5" width="23" height="11" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/>
          <rect x="2" y="2" width="5" height="8" rx="2" fill="currentColor"/>
          <path d="M25 4v4c0.8-0.3 1.5-1.1 1.5-2S25.8 4.3 25 4z" fill="currentColor" opacity="0.5"/>
        </svg>
      </span>
    </div>

  </div>

  <script>
    const phone = document.querySelector('.phone');
    const lock = document.querySelector('.lock');
    const messages = document.querySelector('.messages');
    const msgApp = document.getElementById('msgApp');
    let startY = 0;

    msgApp.onclick = function () {
      messages.classList.add('open');
      phone.classList.add('in-msg');
    };

    phone.onpointerdown = function (e) {
      startY = e.clientY;
    };
    phone.onpointerup = function (e) {
      if (startY - e.clientY > 50) {
        if (messages.classList.contains('open')) {
          messages.classList.remove('open');
          phone.classList.remove('in-msg');
        } else {
          lock.classList.add('up');
        }
      }
    };
  </script>
</body>
</html>
